<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: usa toda la pantalla en celulares con notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Segundo Cerebro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Aquí la librería dibuja el canvas 3D -->
  <div id="grafo" aria-label="Grafo 3D de ideas"></div>

  <!-- Encabezado y leyenda de colores (se rellena desde app.js) -->
  <header id="encabezado">
    <h1>Segundo Cerebro</h1>
    <ul id="leyenda"></ul>
  </header>

  <!-- Ayuda de controles: cambia el texto según sea mouse o pantalla táctil -->
  <p id="ayuda">
    <span class="solo-mouse">Arrastra para rotar · rueda para zoom · clic en un nodo</span>
    <span class="solo-tactil">Un dedo para rotar · pellizca para zoom · toca un nodo</span>
  </p>

  <!-- Aviso breve ("Prompt copiado", etc.) -->
  <div id="aviso" role="status" hidden></div>

  <!-- Mensaje de error si no se pudo cargar graph.json -->
  <div id="error" hidden></div>

  <!-- Panel de detalle del nodo seleccionado -->
  <aside id="panel" aria-hidden="true">
    <button id="cerrar" type="button" aria-label="Cerrar panel">✕</button>
    <span id="panel-tipo" class="chip"></span>
    <h2 id="panel-titulo"></h2>
    <p id="panel-meta"></p>
    <a id="panel-url" target="_blank" rel="noopener noreferrer" hidden>Abrir fuente ↗</a>
    <div id="panel-contenido"></div>

    <!-- Conectar la idea con Claude. Usa TU cuenta de claude.ai (sin API key:
         en una página pública, una key quedaría a la vista de cualquiera).
         Copia el prompt y abre un chat vacío: tú lo pegas y revisas antes de enviar. -->
    <section id="seccion-claude">
      <h3>Desarrollar con Claude</h3>
      <div class="acciones">
        <button id="btn-abrir-claude" type="button" class="boton boton-principal">Copiar y abrir Claude ↗</button>
        <button id="btn-copiar-prompt" type="button" class="boton">Copiar prompt</button>
      </div>
      <form id="form-pregunta" class="pregunta">
        <input id="input-pregunta" type="text" placeholder="Pregúntale algo sobre esta idea…"
               autocomplete="off" enterkeyhint="send" aria-label="Pregunta para Claude">
        <button type="submit" class="boton">Preguntar ↗</button>
      </form>
    </section>

    <!-- Plan generado con scripts/desarrollar.py (solo si existe) -->
    <section id="seccion-plan" hidden>
      <h3>Plan de desarrollo</h3>
      <div id="panel-plan" class="plan"></div>
    </section>

    <section id="panel-padres-seccion" hidden>
      <h3>Nació de</h3>
      <ul id="panel-padres" class="lista-nodos"></ul>
    </section>

    <section>
      <h3>Conexiones <span id="panel-num-conexiones"></span></h3>
      <ul id="panel-conexiones" class="lista-nodos"></ul>
    </section>
  </aside>

  <!-- type="module": app.js usa "import" para cargar 3d-force-graph y Three.js
       desde el CDN (con versiones fijas, para que no cambien solas) -->
  <script type="module" src="app.js"></script>
</body>
</html>
