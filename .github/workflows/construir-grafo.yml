# GitHub Action: procesa los links agregados desde la página y reconstruye
# web/graph.json cada vez que cambian los nodos.
#
# Flujo automático: la página deja pendientes/<id>.json con un link; aquí se
# resume con la API de Claude (la key es un secreto de GitHub, nunca está en la
# página), se crea la fuente, se reconstruye el grafo y se vuelve a publicar.

name: Construir grafo

on:
  push:
    branches: [main]
    # Solo cuando cambia algo que afecta al grafo (no en cada commit)
    paths:
      - "ideas/**"
      - "fuentes/**"
      - "fusionadas/**"
      - "pendientes/*.json"
      - "planes/**"
      - "perfil.md"
      - "scripts/**"
      - "requirements.txt"
      - "requirements.lock"
  workflow_dispatch: {} # permite ejecutarla a mano desde la pestaña Actions

# Si llegan dos pushes seguidos, la segunda ejecución espera a la primera
concurrency:
  group: construir-grafo
  cancel-in-progress: false

# Permisos mínimos: solo lo necesario. Esta Action se ejecuta únicamente con
# pushes a main (que solo puedes hacer tú), nunca con pull requests de terceros.
permissions:
  contents: write # para hacer commit de graph.json
  pages: write    # para pedirle a GitHub Pages que vuelva a publicar

# SEGURIDAD — código confiable fijado:
# Los pasos que usan tus claves NO ejecutan el código de main (que podría cambiar
# alguien con un token de la página robado), sino el de este commit exacto. Este
# archivo solo se puede modificar con permiso "workflow", que el token de la página
# no tiene. Del repositorio actual solo se LEEN datos (nodos y pendientes).
# Para confiar en código nuevo, después de revisarlo y subirlo:
#     bash scripts/confiar_codigo.sh
env:
  CODIGO_CONFIABLE: 1db50aeab421864ce01414e3cb3e24e8f82ac785

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Cada Action va fijada a un commit exacto (SHA) y no a una etiqueta como "v4":
      # una etiqueta se puede mover a otro código; un SHA no. Así nadie puede cambiar
      # lo que se ejecuta con permiso de escritura en el repo.
      # Datos: el estado actual de main (nodos, pendientes). Aquí nada se ejecuta.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true # necesario para hacer push de graph.json

      # Código: el commit confiable fijado arriba, en una carpeta aparte
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CODIGO_CONFIABLE }}
          path: confiable
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"
          cache: pip # guarda los paquetes descargados entre ejecuciones
          cache-dependency-path: confiable/requirements.lock

      # El modelo de embeddings pesa ~470 MB: lo guardamos en caché para no
      # descargarlo en cada ejecución.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: modelo-embeddings-v1

      # Entorno de Python ya instalado, en caché: ahorra ~40 s por ejecución. La clave
      # incluye la huella de requirements.lock: si cambia una dependencia, se reinstala.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: entorno
        with:
          path: ~/venv
          key: venv-${{ steps.python.outputs.python-version }}-${{ hashFiles('confiable/requirements.lock') }}

      # requirements.lock del código confiable: TODAS las dependencias con versión exacta
      # y huella SHA-256 (--require-hashes). Si alguien alterara un paquete, la
      # instalación fallaría en vez de ejecutarse en el paso que usa tus claves.
      - name: Instalar dependencias
        if: steps.entorno.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install --require-hashes --no-deps -r confiable/requirements.lock \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Usar el entorno
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      # Claude Code (versión fija) para usar tu suscripción de Claude sin pagar API
      - name: Instalar Claude Code
        if: hashFiles('pendientes/*.json') != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      # Solo si la página dejó links o PDFs pendientes. Las claves existen únicamente
      # en este paso (no en los demás) y GitHub las oculta si aparecen en los registros.
      - name: Procesar links agregados desde la página
        if: hashFiles('pendientes/*.json') != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          PDF_PRIVATE_KEY: ${{ secrets.PDF_PRIVATE_KEY }}
          SEGUNDO_CEREBRO_DATOS: ${{ github.workspace }}
        working-directory: confiable
        run: python scripts/procesar_pendientes.py

      - name: Construir graph.json
        env:
          SEGUNDO_CEREBRO_DATOS: ${{ github.workspace }}
        working-directory: confiable
        run: python scripts/build_graph.py

      - name: Guardar cambios (fuentes e ideas nuevas, pendientes y graph.json)
        run: |
          git add -A web/graph.json fuentes ideas
          # pendientes/ puede no existir (aún no se agregó nada desde la página)
          git add -A pendientes 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "grafo: reconstruido automáticamente"
          # Por si hubo otro push mientras construíamos
          git pull --rebase
          git push
          # Los commits hechos con el token de la Action no disparan otras
          # automatizaciones, así que pedimos la publicación de la página a mano.
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
